[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "flyweight"
version = "0.2.0"
description = "Native GGUF inference runtime for Qwen, Laguna, Muse, DeepSeek-V4 and Gemma models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["Jinja2>=3.1"]

[project.optional-dependencies]
client = ["openai>=2.0"]

[project.scripts]
flyweight = "flyweight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flyweight = [
  "ui/*.html",
  "ui/*.css",
  "ui/*.js",
  "ui/*.svg",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# ctypes field declarations may contain a third bit-width element, and values
# returned from C-backed metadata dictionaries are necessarily runtime-typed.
disable_error_code = ["misc", "call-overload"]

# numpy 2.5's stubs are written in 3.12 syntax (`type` statements), which mypy
# parses with the grammar of `python_version` above -- so checking our code
# against the oldest Python we support failed inside a dependency before it
# reached a line of ours. Skipping the import types numpy as Any, which is all
# `ignore_missing_imports` was already giving it here anyway.
[[tool.mypy.overrides]]
# Both spellings: "numpy.*" does not match the top-level `numpy` module, which
# is the one whose __init__.pyi carries the 3.12 syntax.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
