[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name. "flyweight" is prohibited on PyPI; the import
# package and the command are still `flyweight`.
name = "flyweight-llm"
version = "0.4.1"
description = "Native GGUF and safetensors inference runtime for Qwen, Laguna, K2-Horizon, Muse, DeepSeek-V4, Gemma and BailingMoE3 models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["Jinja2>=3.1"]

[project.optional-dependencies]
client = ["openai>=2.0"]
# The suite as CI runs it. pytest-xdist is what makes the parity tests
# (a fixture build plus two full generations each) run side by side rather
# than one after another.
test = ["pytest>=8", "pytest-xdist>=3"]
# Image input decoding and resizing for the vision tower (--mmproj).
vision = ["Pillow>=10"]

[project.scripts]
flyweight = "flyweight.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` is declared here as well as in conftest so `-m slow` works before
# the plugin has configured.
markers = ["slow: exhaustive parity test measured in minutes; needs --run-slow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flyweight = [
  "ui/*.html",
  "ui/*.svg",
  "ui/assets/*",
]

[tool.ruff.lint]
# The classic default set, spelled out. ruff 0.16 widened its defaults (import
# sorting, shebang checks, blind-except, ...) and CI, which installs the latest
# ruff, started failing on rules this code never opted into while an older
# local ruff passed. Pinning the selection keeps the two in agreement.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# 3.12 rather than requires-python's 3.11: numpy 2.5's stubs are written with
# `type` statements, which mypy parses with the grammar of this setting. CI's
# matrix still RUNS 3.11, so a real incompatibility is caught by the tests.
python_version = "3.12"
ignore_missing_imports = true
# ctypes field declarations may contain a third bit-width element, and values
# returned from C-backed metadata dictionaries are necessarily runtime-typed.
disable_error_code = ["misc", "call-overload"]
# numpy is checked normally. A `follow_imports = "skip"` override on it used to
# sit here as a second belt beside the 3.12 floor above, and it was worse than
# nothing: skipping types the module as Any, which makes every
# `x = np.zeros(...)` an un-inferrable assignment. That was invisible while CI
# had no numpy installed and ignore_missing_imports covered it, and became 23
# spurious var-annotated errors the moment the test job started installing it.

