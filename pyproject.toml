[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colibri-next"
version = "0.2.0"
description = "Native GGUF inference runtime for Qwen and Gemma models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
client = ["openai>=2.0"]

[project.scripts]
colibri-next = "colibri_next.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
colibri_next = [
  "ui/*.html",
  "ui/*.css",
  "ui/*.js",
  "ui/*.svg",
  "_native/colibri_v2.dll",
  "_native/colibri_v2.so",
  "_native/colibri_v2.dylib",
]
