name: CI

on:
  # A branch push and its pull request used to start two identical runs of this
  # whole matrix, and merging the PR cancelled the PR's copy -- which `gh pr
  # checks` reports as a failure, so a green merge looked red. Pushes are
  # watched on main only; branches are covered by their pull request.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # A change to what ships must bump the version, and a released number is
  # spent. Docs, plans, tools and CI change freely. See CONTRIBUTING.md.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version bumped for shipped changes
        run: python tools/check_version_bump.py origin/${{ github.base_ref }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        # numpy is a TEST dependency only -- 30 test modules import it at module
        # scope for their reference implementations -- and is deliberately not a
        # dependency of the package, which installs with none. Without it here
        # every one of those modules is a collection error, which is what the
        # test job had been failing on.
        run: python -m pip install --upgrade pip build mypy numpy pytest pytest-xdist ruff wheel
      # The install is what a first-time user runs, so CI runs exactly that and
      # nothing else to obtain the runtime. It used to build via native_build
      # with PYTHONPATH=src, which is why `pip install -e .` was free to stop
      # producing a library without any job noticing.
      - name: Install (builds the native runtime)
        run: pip install -e .
      - name: Check the install reports itself healthy
        run: flyweight doctor
      # Adds the contract tests and benchmarks to the same build tree. The
      # library's compile flags do not change, so this links the extra targets
      # rather than compiling the runtime a second time.
      - name: Build development targets
        run: python -m flyweight.native_build
      - name: Native contract tests
        run: ctest --test-dir build/native --output-on-failure -C Release
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The web UI build is committed; CI rebuilds it and fails if the
      # committed bundle is stale, then the pytest run picks up vitest.
      - name: Web UI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd web
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          git -C .. diff --exit-code --stat -- src/flyweight/ui
      - name: Lint
        run: ruff check src tests bench tools native/tools setup.py
      - name: Type check
        run: mypy src/flyweight
      # The POSIX-only calls (os.sysconf, POSIX_FADV_DONTNEED) are guarded at
      # runtime, but mypy checks against the stubs of the platform it is
      # running on, so only the Windows job saw them -- and that job spent a
      # month failing at an earlier step, so it never did. Asking the question
      # on Linux too costs seconds and is reproducible on a developer's box.
      - name: Type check as Windows
        if: runner.os == 'Linux'
        run: mypy --platform win32 src/flyweight
      - name: Test
        # CI runs everything, including the tests marked slow, in parallel:
        # they are the parity checks worth having a machine wait for.
        run: pytest -q -n auto --run-slow
      - name: Build platform wheel
        run: python -m build --wheel
      - name: Inspect wheel contents
        shell: python
        run: |
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          assert "none-any" not in wheel.name, wheel.name
          names = zipfile.ZipFile(wheel).namelist()
          libraries = [name for name in names if name.endswith((".so", ".dll", ".dylib"))]
          assert len(libraries) == 1, libraries
          # A reused build/lib from before a rename packed a second, stale
          # package beside the real one -- two libraries in one wheel, and the
          # count above was the only thing that noticed. Name the cause too.
          packages = {name.split("/")[0] for name in names}
          # setuptools normalises the distribution name flyweight-llm to
          # flyweight_llm in the dist-info directory.
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert packages <= {"flyweight", f"flyweight_llm-{version}.dist-info"}, packages
          # Contract tests and benchmarks belong in the build tree, never in
          # the shipped package.
          strays = [
              name for name in names
              if "_native/" in name
              and not name.endswith((".so", ".dll", ".dylib", ".gitkeep"))
          ]
          assert not strays, strays
