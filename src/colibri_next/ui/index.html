<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#212121">
  <title>Colibri Chat</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Resolves the theme before the stylesheet is applied and before the first
       paint. app.js is a module, so it is deferred until after the document has
       been parsed and rendered — deciding the theme there would show a frame of
       the wrong one to anyone whose choice differs from the CSS default. This
       stays inline and dependency-free for the same reason: an external file
       would be another round trip in front of the first paint. -->
  <script>
    (function () {
      var preference = "system";
      try {
        var saved = localStorage.getItem("colibri.theme");
        if (saved === "light" || saved === "dark" || saved === "system") {
          preference = saved;
        }
      } catch (error) {
        // Storage is unavailable in hardened profiles; fall back to the OS.
      }
      var root = document.documentElement;
      var dark = preference === "dark" || (
        preference === "system"
        && window.matchMedia("(prefers-color-scheme: dark)").matches
      );
      root.dataset.theme = dark ? "dark" : "light";
      root.dataset.themePreference = preference;
    })();
  </script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Conversation history">
      <div class="brand-row">
        <a class="brand" href="/" aria-label="Colibri Chat home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M25.7 7.4c-4.8.2-8.8 1.8-11.7 4.8-1.2 1.2-2.1 2.5-2.8 4-1.8-.5-3.6-.3-5.2.6 1.5.5 2.7 1.3 3.7 2.5-.2 1.5-.1 3 .3 4.5 1.1-1.3 2.4-2.3 3.9-2.9 1.2 1.3 2.7 2.3 4.5 2.9-.5-1.6-1.3-3-2.4-4.1 1.2-1.1 2.2-2.4 3-3.8 1.8-3.3 4.1-6.1 6.7-8.5Z"/><path d="m24.2 7.5 3.9-2.1-1.6 3.7"/></svg>
          </span>
          <span>Colibri</span>
        </a>
        <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Hide sidebar" data-tooltip="Hide sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9.5 4v16"/></svg>
        </button>
      </div>

      <button class="new-chat-button" id="new-chat" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>New conversation</span>
        <kbd>Ctrl K</kbd>
      </button>

      <label class="search-box" id="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        <span class="sr-only">Search conversations</span>
        <input id="conversation-search" type="search" placeholder="Search chats" autocomplete="off">
      </label>

      <div class="history-label">Recent</div>
      <nav class="conversation-list scroll-region" id="conversation-list"></nav>

      <div class="sidebar-footer">
        <button class="sidebar-action" id="open-settings" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
          <span>Settings</span>
        </button>
        <button class="sidebar-action" id="import-chat" type="button">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <span>Import</span>
        </button>
        <button class="icon-button theme-toggle" id="theme-toggle" type="button">
          <svg class="theme-icon system-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg>
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <main class="main-panel">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button sidebar-open" id="sidebar-open" type="button" aria-label="Show sidebar" data-tooltip="Show sidebar">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9.5 4v16"/></svg>
          </button>
          <div class="model-line">
            <span class="status-dot" id="status-dot"></span>
            <span id="model-status">Connecting to local model…</span>
            <div class="model-selector-wrap" id="model-selector-wrap" hidden>
              <select class="model-selector" id="model-selector" aria-label="Select model"></select>
            </div>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="runtime-chip" id="runtime-pill" hidden><span id="device-label">CUDA</span></span>
          <button class="icon-button" id="export-chat" type="button" aria-label="Export conversation" data-tooltip="Export conversation">
            <svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/></svg>
          </button>
          <button class="icon-button" id="clear-chat" type="button" aria-label="Clear conversation" data-tooltip="Clear conversation">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
          </button>
        </div>
      </header>

      <section class="chat-scroll scroll-region" id="chat-scroll" aria-live="polite">
        <div class="chat-column" id="chat-column">
          <section class="welcome" id="welcome">
            <div class="welcome-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32"><path d="M25.7 7.4c-4.8.2-8.8 1.8-11.7 4.8-1.2 1.2-2.1 2.5-2.8 4-1.8-.5-3.6-.3-5.2.6 1.5.5 2.7 1.3 3.7 2.5-.2 1.5-.1 3 .3 4.5 1.1-1.3 2.4-2.3 3.9-2.9 1.2 1.3 2.7 2.3 4.5 2.9-.5-1.6-1.3-3-2.4-4.1 1.2-1.1 2.2-2.4 3-3.8 1.8-3.3 4.1-6.1 6.7-8.5Z"/></svg>
            </div>
            <h1>Your model, your machine.</h1>
          </section>
          <div class="messages" id="messages"></div>
        </div>
      </section>

      <footer class="composer-area">
        <button class="scroll-bottom" id="scroll-bottom" type="button" aria-label="Scroll to latest message" data-tooltip="Scroll to latest message" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 5v13M6 13l6 6 6-6"/></svg>
        </button>
        <div class="composer-shell" id="composer-shell">
          <textarea id="prompt-input" rows="1" dir="auto" placeholder="Message Colibri…" aria-label="Message"></textarea>
          <div class="composer-bottom">
            <div class="composer-options">
              <button class="option-chip" id="thinking-chip" type="button" aria-pressed="false"
                      title="Reasoning off. Click to let the model use its own level.">
                <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M8.2 14.8A7 7 0 1 1 15.8 14.8c-.7.5-.8 1.2-.8 2.2H9c0-1-.1-1.7-.8-2.2Z"/></svg>
                Thinking off
              </button>
              <button class="option-chip" id="quick-settings" type="button">
                <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M7 14v6"/></svg>
                <span id="token-chip">256 tokens</span>
              </button>
            </div>
            <button class="send-button" id="send-button" type="button" aria-label="Send message">
              <svg class="send-icon" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v14"/></svg>
              <svg class="stop-icon" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-note">Runs locally. Generated content may be inaccurate.</div>
      </footer>
    </main>
  </div>

  <dialog class="settings-dialog" id="settings-dialog">
    <form method="dialog" class="settings-card" id="settings-form">
      <div class="settings-header">
        <div>
          <p class="eyebrow">RUNTIME</p>
          <h2>Generation settings</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Close settings">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="settings-body scroll-region">
        <label class="field field-wide">
          <span>API key <small>Kept for this browser session only</small></span>
          <input id="api-key" type="password" placeholder="Optional local bearer token" autocomplete="off">
        </label>

        <label class="field field-wide">
          <span>System prompt</span>
          <textarea id="system-prompt" rows="4" dir="auto" placeholder="You are a helpful assistant."></textarea>
        </label>

        <label class="field">
          <span>Maximum output</span>
          <div class="input-suffix"><input id="max-tokens" type="number" min="1" step="1"><span>tokens</span></div>
        </label>

        <label class="field">
          <span>Temperature</span>
          <input id="temperature" type="number" min="0" max="2" step="0.05">
        </label>

        <label class="field">
          <span>Top P</span>
          <input id="top-p" type="number" min="0.01" max="1" step="0.01">
        </label>

        <label class="field">
          <span>Top K</span>
          <input id="top-k" type="number" min="0" max="200" step="1">
        </label>

        <label class="toggle-field field-wide">
          <span><strong>Thinking mode</strong><small>Allow the model to use its reasoning template</small></span>
          <input id="thinking-setting" type="checkbox">
          <span class="toggle" aria-hidden="true"></span>
        </label>

        <label class="field field-wide">
          <span>Reasoning effort<small>For models that grade their reasoning. Also on the composer chip, which cycles off / on / low / medium / high.</small></span>
          <select id="reasoning-effort">
            <option value="auto">Model default</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
      </div>

      <div class="settings-footer">
        <button class="text-button" id="reset-settings" type="button">Reset defaults</button>
        <button class="primary-button" id="save-settings" value="default">Save settings</button>
      </div>
    </form>
  </dialog>

  <div class="toast-region" id="toast-region" aria-live="assertive"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
